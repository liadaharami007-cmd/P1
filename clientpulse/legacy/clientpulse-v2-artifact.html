<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0C0E">
<title>ClientPulse AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0B0C0E;--panel:#0F1013;--card:#15171B;--card2:#1B1E23;--hover:#1F2228;--line:#22252B;--line2:#2D3139;
  --tx:#ECEEF1;--tx2:#A6ABB5;--mute:#6F7581;--acc:#8E9BFF;--accbg:rgba(142,155,255,.12);
  --g:#41B883;--gbg:rgba(65,184,131,.12);--y:#E3AA45;--ybg:rgba(227,170,69,.13);--r:#EE6B5F;--rbg:rgba(238,107,95,.13);--b:#8E9BFF;--bbg:rgba(142,155,255,.13);
  --rad:14px;--rad2:10px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);--ease:cubic-bezier(.2,.8,.2,1);
  --sbw:236px;color-scheme:dark}
[data-theme=light]{--bg:#F5F5F3;--panel:#FBFBFA;--card:#FFFFFF;--card2:#F7F7F5;--hover:#F1F1EE;--line:#E6E5E1;--line2:#D9D8D3;
  --tx:#15171B;--tx2:#4B505A;--mute:#8A8F99;--acc:#4E5FE0;--accbg:rgba(78,95,224,.09);
  --g:#1E9C6A;--gbg:#E5F4ED;--y:#B87C0A;--ybg:#FBF1DC;--r:#D2453B;--rbg:#FBE8E6;--b:#4E5FE0;--bbg:#ECEEFC;--sh:0 1px 2px rgba(20,22,27,.04),0 6px 18px rgba(20,22,27,.05);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc);text-decoration:none}
bdi,.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accbg)}
.app{display:flex;min-height:100vh}
/* sidebar */
.sb{position:fixed;inset:0 0 0 auto;width:var(--sbw);background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:16px;letter-spacing:-.2px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8E9BFF,#41B883);display:grid;place-items:center;box-shadow:0 4px 14px rgba(142,155,255,.35)}
.logo i{width:8px;height:8px;border-radius:50%;background:#0B0C0E;display:block}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:-3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--tx2);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--hover);color:var(--tx)}
.nav a.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.nav a .ct{margin-inline-start:auto;font-size:11px;background:var(--rbg);color:var(--r);border-radius:99px;padding:0 7px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sbfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.clock{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.clock .l{font-size:11px;color:var(--mute)}.clock .v{font-weight:600}
.row2{display:flex;gap:6px;align-items:center}
.sel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:100%}
/* main */
.main{flex:1;margin-inline-start:var(--sbw);min-width:0}
.tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.tb h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.kbd{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:7px 10px;min-width:220px;transition:border-color .15s}
.kbd:hover{border-color:var(--line2);color:var(--tx2)}
.kbd kbd{margin-inline-start:auto;font-family:inherit;font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);border:1px solid var(--line);background:var(--card)}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
.iconbtn .dotc{position:absolute;top:-4px;inset-inline-end:-4px;min-width:17px;height:17px;border-radius:99px;background:var(--r);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.view{padding:24px 28px 80px;max-width:1320px;margin:0 auto;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s,transform .06s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--tx);color:var(--bg)}.pri:hover{opacity:.9}
.sec{background:var(--card);border:1px solid var(--line);color:var(--tx)}.sec:hover{border-color:var(--line2);background:var(--hover)}
.acc{background:var(--acc);color:#0B0C0E}[data-theme=light] .acc{color:#fff}
.dng{background:var(--rbg);color:var(--r)}
.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.h2{font-size:14.5px;font-weight:650;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.h2 .sp{flex:1}
.eyebrow{font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.2px}
.muted{color:var(--mute)}.tx2{color:var(--tx2)}.small{font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-green{background:var(--g);box-shadow:0 0 0 3px var(--gbg)}.d-yellow{background:var(--y);box-shadow:0 0 0 3px var(--ybg)}.d-red{background:var(--r);box-shadow:0 0 0 3px var(--rbg)}.d-imp{background:var(--b);box-shadow:0 0 0 3px var(--bbg)}.d-none{background:var(--line2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;line-height:1.6}
.p-red{background:var(--rbg);color:var(--r)}.p-yellow{background:var(--ybg);color:var(--y)}.p-green{background:var(--gbg);color:var(--g)}.p-imp{background:var(--bbg);color:var(--b)}.p-gray{background:var(--card2);color:var(--tx2);box-shadow:inset 0 0 0 1px var(--line)}.p-new{background:var(--tx);color:var(--bg)}
.up{color:var(--r)}.down{color:var(--g)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.35fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
/* hero */
.hello{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:26px;letter-spacing:-.4px;margin:0;font-weight:700}
.hello .meta{color:var(--tx2);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.conn{display:inline-flex;align-items:center;gap:6px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{text-align:start;padding:14px 16px;border-radius:var(--rad);background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s;position:relative;min-width:0}
button.kpi:hover{border-color:var(--line2);transform:translateY(-1px)}
.kpi .l{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:7px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:4px;line-height:1.15}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px}
/* summary */
.sum p{font-size:16px;line-height:1.75;margin:0}
.sum .lk{color:var(--tx);border-bottom:1px dashed var(--line2);cursor:pointer;font-weight:600}
.sum .lk:hover{border-bottom-color:var(--acc);color:var(--acc)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.act{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);text-align:start;transition:border-color .15s}
.act:hover{border-color:var(--line2)}
.act .n{width:22px;height:22px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--tx2);flex:none}
.engine{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
/* list rows */
.list .rw{display:grid;grid-template-columns:minmax(190px,1.7fr) 90px 1fr .7fr .9fr minmax(200px,2fr);gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);text-align:start;width:100%;transition:background .12s}
.list .rw:hover{background:var(--hover)}
.list .hd{font-size:11.5px;color:var(--mute);font-weight:600;background:var(--card2)}
.list .hd:hover{background:var(--card2)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}.nm .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm .s{font-size:11.5px;color:var(--mute)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line2);color:var(--tx2);flex:none}
.iss{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--tx2);min-width:0}
.chg{font-size:11.5px;margin-inline-start:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.inp{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--tx2);background:var(--card);transition:all .15s}
.chip:hover{color:var(--tx);border-color:var(--line2)}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;color:var(--tx2)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.fi:first-child{border-top:0}
.fi .tm{color:var(--mute);font-size:11.5px;white-space:nowrap;min-width:54px}
/* client 360 */
.ch{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{font-size:24px;margin:0;letter-spacing:-.3px}
.back{color:var(--tx2);display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-bottom:10px}
.mets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.met{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.met .l{font-size:11.5px;color:var(--mute)}.met .v{font-size:18px;font-weight:700;letter-spacing:-.3px}.met .c{font-size:11.5px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;direction:ltr}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:2}
.tip.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
/* alert / investigation */
.al{border-inline-start:3px solid var(--y);padding:16px 18px}.al.red{border-inline-start-color:var(--r)}.al.imp{border-inline-start-color:var(--b)}
.alh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alh .t{font-weight:700;font-size:15px}
.meta2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0 10px}
.inv{display:grid;gap:14px;margin-top:6px}
.blk .k{font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.3px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tag3{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.t-fact{background:var(--gbg);color:var(--g)}.t-hyp{background:var(--ybg);color:var(--y)}.t-rec{background:var(--bbg);color:var(--b)}
.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft td{padding:6px 4px;border-bottom:1px solid var(--line)}.ft td:not(:first-child){text-align:end;white-space:nowrap}
.ft th{font-size:11px;color:var(--mute);font-weight:600;text-align:start;padding-bottom:4px}.ft th:not(:first-child){text-align:end}
.hyp{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin-bottom:6px}
.hyp .bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.hyp .bar i{display:block;height:100%;background:var(--y);border-radius:4px}
.plan{margin:0;padding:0;list-style:none;counter-reset:p}
.plan li{counter-increment:p;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.plan li::before{content:counter(p);width:20px;height:20px;border-radius:6px;background:var(--bbg);color:var(--b);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.ul{margin:0;padding-inline-start:18px;font-size:13.5px}.ul li{margin:3px 0}
.okbox{background:var(--gbg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.unk{font-size:12.5px;color:var(--mute)}
/* tasks */
.tk{padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .3s}
.tk.hl{box-shadow:0 0 0 2px var(--acc)}
.tkh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tkh .t{font-weight:650}
.flow{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
.flow span{padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mute)}
.flow span.on{background:var(--accbg);color:var(--acc);font-weight:700}.flow span.past{color:var(--tx2)}
.hist{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
details summary{cursor:pointer;color:var(--tx2);font-size:12.5px;list-style:none}details summary::-webkit-details-marker{display:none}
/* timeline */
.tl{position:relative;padding-inline-start:18px}
.tl::before{content:"";position:absolute;inset-inline-start:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tli{position:relative;padding:6px 0 10px;font-size:13px}
.tli::before{content:"";position:absolute;inset-inline-start:-18px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--line2)}
.tli.alert::before{border-color:var(--r)}.tli.task::before{border-color:var(--acc)}.tli.verified::before{border-color:var(--g);background:var(--g)}.tli.automation::before{border-color:var(--y)}
.tli .w{font-size:11.5px;color:var(--mute)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.mu{align-self:flex-start;background:var(--tx);color:var(--bg);padding:9px 13px;border-radius:14px 14px 14px 4px;max-width:80%}
.ma{align-self:flex-end;background:var(--card2);border:1px solid var(--line);padding:12px 14px;border-radius:14px 14px 4px 14px;max-width:88%}
.ma .ev{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--tx2)}.ma .ev li{padding:3px 0;border-top:1px dashed var(--line)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer .inp{flex:1}
/* switch */
.sw{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .2s var(--ease)}
.sw.on{background:var(--g)}.sw.on::after{inset-inline-start:19px}
.rule{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}.rule:first-of-type{border-top:0}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,6,8,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.pal{width:min(620px,100%);background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;transform:translateY(-6px) scale(.99);transition:transform .2s var(--ease)}
.ov.on .pal{transform:none}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:15px;outline:none}
.pal .res{max-height:52vh;overflow-y:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;width:100%;text-align:start}
.pal .it.on,.pal .it:hover{background:var(--hover)}
.pal .grp{font-size:11px;color:var(--mute);padding:8px 12px 4px;font-weight:600}
.modal{width:min(860px,100%);max-height:84vh;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.panel{position:fixed;top:60px;inset-inline-end:auto;left:20px;width:min(400px,calc(100% - 32px));max-height:70vh;overflow-y:auto;z-index:55;opacity:0;pointer-events:none;transform:translateY(-6px);transition:all .18s var(--ease)}
.panel.on{opacity:1;pointer-events:auto;transform:none}
.ni{padding:11px 14px;border-top:1px solid var(--line);font-size:13px;text-align:start;width:100%;display:flex;gap:9px}.ni:hover{background:var(--hover)}.ni.unread{background:var(--accbg)}
.toasts{position:fixed;bottom:22px;left:22px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:13.5px;max-width:380px;animation:tin .25s var(--ease);display:flex;gap:9px;align-items:flex-start;pointer-events:auto}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tour */
.tour{position:fixed;bottom:20px;left:20px;width:min(420px,calc(100% - 32px));z-index:50;padding:16px 18px;border-color:var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.steps{display:flex;gap:4px;margin:8px 0 12px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line2)}.steps i.on{background:var(--acc)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--card2) 0%,var(--hover) 50%,var(--card2) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{padding:28px;text-align:center;color:var(--mute);font-size:13.5px}
.note{font-size:12px;color:var(--mute)}
.mock{white-space:nowrap;font-size:11px;font-weight:600;color:var(--y);background:var(--ybg);padding:2px 8px;border-radius:99px}
/* report (also print) */
.rep{padding:24px 28px;color:var(--tx)}
.rep h3{margin:0 0 4px;font-size:20px}.rep h4{margin:18px 0 8px;font-size:14px}
.rep table{width:100%;border-collapse:collapse;font-size:13px}.rep td,.rep th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start}
.rep .rk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* mobile nav */
.bn{display:none}
.more-sheet .it{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px}
@media (max-width:1100px){.mets{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .sb{display:none}.main{margin:0}.g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tb{padding:10px 14px}.kbd{min-width:0;padding:8px}.kbd span,.kbd kbd{display:none}
  .view{padding:16px 14px 110px}
  .bn{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bn a,.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 0;position:relative}
  .bn .on{color:var(--tx)}
  .list .hd{display:none}
  .list .rw{grid-template-columns:1fr auto;gap:6px 10px;padding:12px 14px}
  .list .c-owner,.list .c-leads,.list .c-spend{display:none}
  .list .c-cpl{grid-column:2;grid-row:1;text-align:end}
  .list .iss{grid-column:1/-1}
  .tour{bottom:76px;left:12px;right:12px;width:auto}
  .toasts{bottom:84px;left:12px;right:12px}.toast{max-width:none}
  .panel{left:12px;right:12px;width:auto}
  .hello h2{font-size:22px}
  .tb h1{font-size:15px}.tb .mock{display:none}
  .rep{padding:16px}.rep .rk{grid-template-columns:repeat(2,1fr)}
  .chat{height:calc(100vh - 200px)}
  .mets{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}.printable,.printable *{visibility:visible}
  .printable{position:absolute;inset:0;background:#fff;color:#111}
  .printable .no-print{display:none}
}

<body>
<div id="app"></div>
<script>/* ClientPulse 2.0 — core: data providers, intelligence engine, investigation, alert lifecycle.
 * Pure logic, no DOM. Runs in the browser (window.CPCore) and in Node (module.exports) for tests.
 *
 * Provider contract (every data source implements it; the engine only sees normalized data):
 *   provider.id, provider.label, provider.kind ('ads'|'leads'|'crm'), provider.connected, provider.isMock
 *   provider.listClients()                     -> [{ id, name, industry, owner, goals:{targetCpl, monthlyBudget} }]
 *   provider.getDays(clientId, fromIdx, toIdx, ctx) -> [{ date:'YYYY-MM-DD', spend, impressions, clicks, leads }]
 * Day indexes are UTC epoch days (dayIdx('2026-11-08') === 20400).
 */
(function (root) {
  'use strict';

  // ---------------- utils ----------------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function poisson(rng, l) {
    if (l <= 0) return 0;
    if (l > 30) { var u1 = rng() || 1e-9, u2 = rng(); return Math.max(0, Math.round(l + Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2) * Math.sqrt(l))); }
    var L = Math.exp(-l), k = 0, p = 1; do { k++; p *= rng(); } while (p > L); return k - 1;
  }
  function dayIdx(iso) { var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function isoOf(idx) { return new Date(idx * 864e5).toISOString().slice(0, 10); }
  function fmtDay(idx) { var s = isoOf(idx).split('-'); return +s[2] + '.' + +s[1]; }
  function money(x) { return '₪' + Math.round(x).toLocaleString('en-US'); }
  function money2(x) { return '₪' + x.toFixed(2); }
  function pct(x) { return Math.round(x * 100); }
  function sgn(x) { return (x > 0 ? '+' : '') + pct(x) + '%'; }
  function r0(x) { return Math.round(x); }

  // ---------------- team ----------------
  var TEAM = [
    { id: 'niv', name: 'ניב', role: 'בעלים', approver: true },
    { id: 'yuval', name: 'יובל', role: 'מנהל תפעול', approver: true },
    { id: 'dana', name: 'דנה', role: 'מנהלת קמפיינים', approver: false },
    { id: 'omer', name: 'עומר', role: 'מנהל קמפיינים', approver: false }
  ];

  // ---------------- Mock provider ----------------
  var TYPES = ['מרפאת שיניים', 'סטודיו פילאטיס', 'משרד עורכי דין', 'שיווק נדל"ן', 'מכון כושר', 'קבלן שיפוצים', 'משרד רו"ח', 'מטבחים', 'קוסמטיקה', 'גני אירועים', 'סוכנות ביטוח', 'אנרגיה סולארית', 'אופטיקה', 'פיזיותרפיה', 'קורסים אונליין', 'השכרת רכב', 'בית ספר לנהיגה', 'רהיטים', 'מיזוג אוויר', 'מרפאה אסתטית'];
  var NAMES = ['כהן', 'לוי', 'מזרחי', 'פרץ', 'ביטון', 'אברהם', 'פרידמן', 'אזולאי', 'דהן', 'אוחנה', 'שפירא', 'גבאי', 'חדד', 'רוזן', 'קפלן', 'עמר', 'בן דוד', 'סויסה', 'טל', 'נחום', 'אשכנזי', 'ברק', 'שלום', 'גולן', 'יוסף'];
  var SCEN = [['healthy', 26], ['cpl_spike', 5], ['no_leads', 4], ['gradual', 5], ['improved', 4], ['low_data', 3], ['multi', 2], ['data_gap', 1]];
  var CAUSES = ['cvr', 'cpm', 'ctr', 'cvr', 'cpm'];

  function createMockProvider(T0, seed) {
    var rng = mulberry32(seed), list = [];
    SCEN.forEach(function (s) { for (var k = 0; k < s[1]; k++) list.push(s[0]); });
    for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = list[i]; list[i] = list[j]; list[j] = tmp; }
    var spikeN = 0, owners = ['dana', 'omer', 'dana', 'omer', 'yuval'];
    var clients = list.map(function (sc, i) {
      var cpl, lpd, cpm = 25 + rng() * 35, ctr = 0.008 + rng() * 0.02, s = { start: null };
      if (sc === 'low_data') { cpl = 120 + rng() * 80; lpd = 0.25 + rng() * 0.15; }
      else if (sc === 'gradual') { cpl = 40 + rng() * 40; lpd = 40 + rng() * 15; }
      else if (sc === 'cpl_spike' || sc === 'improved' || sc === 'multi') { cpl = 30 + rng() * 120; lpd = 12 + rng() * 10; }
      else { cpl = 30 + rng() * 120; lpd = 4 + rng() * 16; }
      if (sc === 'no_leads' && lpd < 6) lpd = 6;
      var cvr = cpm / (1000 * ctr * cpl);
      if (sc === 'cpl_spike') { s.days = 3 + (i % 2); s.start = T0 - s.days + 1; s.mult = 2.3 + rng() * 0.5; s.cause = CAUSES[spikeN++ % CAUSES.length]; }
      if (sc === 'no_leads') s.start = T0 - (i % 2);
      if (sc === 'improved') { s.start = T0 - 6; s.mult = 0.58 + rng() * 0.06; }
      if (sc === 'gradual') s.start = T0 - 20;
      if (sc === 'multi') s.start = T0 - 6;
      if (sc === 'data_gap') s.start = T0 - 1;
      var daily = cpl * lpd;
      return {
        id: 'c' + (i + 1), name: TYPES[(i * 7) % TYPES.length] + ' ' + NAMES[(i * 11 + 3) % NAMES.length],
        industry: TYPES[(i * 7) % TYPES.length], owner: owners[i % owners.length], scenario: sc, scn: s,
        goals: { targetCpl: Math.round(cpl * (1.1 + rng() * 0.2)), monthlyBudget: Math.round(daily * 30.4 * (1.05 + rng() * 0.15) / 100) * 100 },
        p: { cpm: cpm, ctr: ctr, cvr: cvr, daily: daily }, seed: (seed * 31 + i * 7919) >>> 0
      };
    });
    var byId = {}; clients.forEach(function (c) { byId[c.id] = c; });

    // op is active on day t if it started and no later 'fix' cut it off
    function activeFrom(start, t, fixes) {
      if (start == null || t < start) return false;
      for (var k = 0; k < fixes.length; k++) if (fixes[k] >= start && fixes[k] <= t) return false;
      return true;
    }
    function genDay(c, t, ops) {
      var r = mulberry32((c.seed ^ Math.imul(t, 2654435761)) >>> 0);
      var fixes = ops.filter(function (o) { return o.op === 'fix'; }).map(function (o) { return o.from; });
      var spM = 1, cpmM = 1, ctrM = 1, cvrM = 1, zero = false, gap = false, s = c.scn;
      if (activeFrom(s.start, t, fixes)) {
        var sc = c.scenario;
        if (sc === 'cpl_spike') { if (s.cause === 'cvr') cvrM /= s.mult; else if (s.cause === 'cpm') cpmM *= s.mult; else ctrM /= s.mult; }
        if (sc === 'gradual') ctrM /= Math.pow(1.015, Math.min(t - s.start + 1, 35));
        if (sc === 'improved') cvrM /= s.mult;
        if (sc === 'multi') { spM *= 1.7; ctrM *= 0.6; if (t >= s.start + 3) cvrM /= 2.1; }
        if (sc === 'no_leads') zero = true;
        if (sc === 'data_gap') gap = true;
      }
      ops.forEach(function (o) {
        if (o.op === 'fix' || !activeFrom(o.from, t, fixes)) return;
        if (o.op === 'cpl') cvrM /= 1 + o.pct / 100;
        if (o.op === 'cpm') cpmM *= 1 + o.pct / 100;
        if (o.op === 'ctr') ctrM *= 1 - o.pct / 100;
        if (o.op === 'improve') cvrM /= 1 - o.pct / 100;
        if (o.op === 'spend') { spM *= 1 + o.pct / 100; cvrM /= 1 + o.pct / 100; }
        if (o.op === 'zero_leads') zero = true;
        if (o.op === 'disconnect') gap = true;
      });
      var spend = c.p.daily * spM * (1 + (r() - 0.5) * 0.24);
      var impr = Math.round(spend / (c.p.cpm * cpmM) * 1000);
      var clicks = poisson(r, impr * c.p.ctr * ctrM);
      var leads = poisson(r, clicks * c.p.cvr * cvrM);
      if (gap) return null;
      return { date: isoOf(t), spend: Math.round(spend), impressions: impr, clicks: clicks, leads: zero ? 0 : leads };
    }
    return {
      id: 'mock', label: 'נתוני דמו (מדומים)', kind: 'ads', connected: true, isMock: true,
      listClients: function () { return clients.map(function (c) { return { id: c.id, name: c.name, industry: c.industry, surname: NAMES[(+c.id.slice(1) - 1) * 11 % NAMES.length], owner: c.owner, goals: c.goals, scenario: c.scenario, cause: c.scn.cause || null }; }); },
      getDays: function (id, from, to, ctx) {
        var c = byId[id], ops = (ctx && ctx.ops) || [], out = [];
        for (var t = from; t <= to; t++) { var d = genDay(c, t, ops); if (d) out.push(d); }
        return out;
      }
    };
  }

  // Connectors that exist as interfaces only. Never reported as connected without verification.
  var PROVIDERS = [
    { id: 'mock', name: 'נתוני דמו', kind: 'ads', status: 'connected', note: '50 לקוחות מדומים, 90 ימי היסטוריה' },
    { id: 'meta_insights', name: 'Meta Ads Insights', kind: 'ads', status: 'not_connected', needs: 'אפליקציית Meta + הרשאת ads_read ואסימון שנשמר בשרת' },
    { id: 'meta_leads', name: 'Meta Lead Ads', kind: 'leads', status: 'not_connected', needs: 'הרשאת leads_retrieval + Webhook בשרת' },
    { id: 'google_ads', name: 'Google Ads', kind: 'ads', status: 'not_connected', needs: 'Developer token + OAuth, נשמר בשרת' },
    { id: 'crm', name: 'CRM (איכות לידים ומכירות)', kind: 'crm', status: 'not_connected', needs: 'API של ה-CRM. בלעדיו אין ניתוח איכות לידים או פער לידים-מכירות' },
    { id: 'activity', name: 'יומן שינויים בחשבון (Meta Activity Log)', kind: 'ads', status: 'not_connected', needs: 'נדרש כדי לאמת השערות על שינויי קריאייטיב או תקציב' },
    { id: 'webhooks', name: 'Webhooks', kind: 'out', status: 'not_connected', needs: 'Backend עם נקודת קצה מאומתת' },
    { id: 'whatsapp', name: 'WhatsApp Business API', kind: 'out', status: 'not_connected', needs: 'חשבון WABA מאומת + תבניות מאושרות' },
    { id: 'email', name: 'Email', kind: 'out', status: 'not_connected', needs: 'ספק שליחה (SMTP/API) בשרת' },
    { id: 'ai', name: 'מודל AI (Claude / Gemini)', kind: 'ai', status: 'not_connected', needs: 'מפתח API שנשמר בשרת בלבד. עד אז פועל מנוע כללים' }
  ];

  // ---------------- Engine ----------------
  var T = {
    minMaterialDaily: 60, cplYellow: 0.25, cplRed: 0.5, zYellow: -2.5, zRed: -3,
    zeroPYellow: 0.05, zeroPRed: 0.01, spendYellow: 0.3, spendRed: 0.6,
    ctrYellow: 0.25, ctrRed: 0.45, ctrZ: -3, ctrMinClicks: 200,
    trendSlope: 0.06, trendZ: 2.2, trendMinLeads: 25, trendMinLevel: 0.08,
    improveCpl: -0.25, improveZ: 3, improveMinLeads: 10, lowDataLeads: 20, goalOver: 0.3
  };
  function stats(ds) {
    var s = { n: ds.length, spend: 0, leads: 0, clicks: 0, impr: 0 };
    ds.forEach(function (d) { s.spend += d.spend; s.leads += d.leads; s.clicks += d.clicks; s.impr += d.impressions; });
    s.cpl = s.leads ? s.spend / s.leads : null; s.ctr = s.impr ? s.clicks / s.impr : null;
    s.cpc = s.clicks ? s.spend / s.clicks : null; s.cpm = s.impr ? s.spend / s.impr * 1000 : null; s.cvr = s.clicks ? s.leads / s.clicks : null;
    s.dailySpend = s.n ? s.spend / s.n : 0; s.dailyLeads = s.n ? s.leads / s.n : 0; return s;
  }
  function win(days, ref, from, to) { return days.filter(function (d) { var a = ref - dayIdx(d.date); return a >= from && a <= to; }); }
  function conf(absZ) { return absZ >= 4 ? 'גבוהה' : absZ >= 3 ? 'בינונית' : 'נמוכה'; }

  function analyzeClient(c, days, ref) {
    days = days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var alerts = [], info = [];
    var base = stats(win(days, ref, 7, 27)), rec = stats(win(days, ref, 0, 6));
    var material = rec.dailySpend >= T.minMaterialDaily, lowData = base.leads < T.lowDataLeads;
    function cap(sev) { return (!material && sev === 'red') ? 'yellow' : sev; }
    var last = days.length ? dayIdx(days[days.length - 1].date) : null, lag = last == null ? 99 : ref - last;
    var CMP = '7 הימים האחרונים מול 21 הימים שלפניהם';

    if (lag >= 1) alerts.push({ type: 'data', severity: lag >= 2 ? 'red' : 'yellow', durationDays: lag, confidence: 'גבוהה',
      period: 'עד ' + fmtDay(ref), title: 'לא התקבלו נתונים ' + (lag === 1 ? 'מאתמול' : lag + ' ימים'),
      what: 'הנתון האחרון שהתקבל ממקור הנתונים הוא מ-' + (last != null ? fmtDay(last) : '—') + '.',
      numbers: [['ימים ללא נתונים', '0', String(lag)]],
      why: 'בלי נתונים אי אפשר לבקר את הלקוח, וכל בעיה אחרת אצלו נשארת בלתי נראית.', immediate: lag >= 2 });

    var baseCpl = base.cpl;
    if (baseCpl && !lowData) {
      var best = null;
      [3, 7].forEach(function (w) {
        var s = stats(win(days, ref, 0, w - 1)); if (!s.spend) return;
        var exp = s.spend / baseCpl, z = (s.leads - exp) / Math.sqrt(Math.max(exp + exp * exp / base.leads, 1));
        var chg = s.leads ? (s.spend / s.leads) / baseCpl - 1 : Infinity;
        var sev = (chg >= T.cplRed && z <= T.zRed) ? 'red' : (chg >= T.cplYellow && z <= T.zYellow) ? 'yellow' : null;
        if (sev && (!best || sev === 'red' && best.sev !== 'red')) best = { sev: sev, w: w, s: s, exp: exp, chg: chg, z: z };
      });
      if (best) {
        var sev = cap(best.sev), cur = best.s.leads ? best.s.spend / best.s.leads : null;
        alerts.push({ type: 'cpl', severity: sev, durationDays: best.w, window: best.w, confidence: conf(-best.z),
          period: best.w + ' הימים האחרונים מול 21 הימים שלפניהם',
          title: sev === 'red' ? 'עלות לליד זינקה' : 'עלות לליד עולה',
          what: 'העלות לליד ב-' + best.w + ' הימים האחרונים היא ' + (cur ? money(cur) : '—') + ', לעומת ' + money(baseCpl) + ' בממוצע לפני כן.',
          numbers: [['עלות לליד', money(baseCpl), cur ? money(cur) : '—', isFinite(best.chg) ? sgn(best.chg) : ''], ['לידים בתקופה', '~' + r0(best.exp) + ' צפויים', String(best.s.leads)]],
          why: 'התקבלו ' + best.s.leads + ' לידים לעומת כ-' + r0(best.exp) + ' שהיו צפויים לפי ההוצאה. הסטייה מובהקת סטטיסטית ולא רעש יומי.', immediate: sev === 'red' });
      }
    }
    if (baseCpl && days.length) {
      var streak = 0, sSpend = 0, sClicks = 0;
      for (var i = days.length - 1; i >= 0 && days[i].leads === 0 && days[i].spend > 0; i--) { streak++; sSpend += days[i].spend; sClicks += days[i].clicks; }
      if (streak) {
        var expL = sSpend / baseCpl, pz = Math.exp(-expL), zs = pz <= T.zeroPRed ? 'red' : pz <= T.zeroPYellow ? 'yellow' : null;
        if (zs) { zs = cap(zs); alerts.push({ type: 'no_leads', severity: zs, durationDays: streak, confidence: pz < 0.001 ? 'גבוהה' : pz < 0.01 ? 'בינונית' : 'נמוכה',
          period: streak + ' ימים אחרונים', streakClicks: sClicks, streakSpend: sSpend,
          title: 'אין לידים ' + (streak === 1 ? 'מאתמול' : 'כבר ' + streak + ' ימים'),
          what: 'הוצאו ' + money(sSpend) + ' ונרשמו ' + sClicks + ' הקלקות מאז הליד האחרון, אבל לא נכנס אף ליד.',
          numbers: [['לידים צפויים', '~' + expL.toFixed(1), '0'], ['הוצאה ללא לידים', '', money(sSpend)]],
          why: 'לפי הביצועים הרגילים, הסיכוי לאפס לידים במקרה הוא ' + (pz < 0.001 ? 'פחות מ-0.1%' : (pz * 100).toFixed(1) + '%') + '.', immediate: zs === 'red' }); }
      }
    }
    if (base.dailySpend && rec.n >= 4 && material) {
      var sUp = rec.dailySpend / base.dailySpend - 1, lUp = base.dailyLeads ? rec.dailyLeads / base.dailyLeads - 1 : 0;
      var ss = (sUp >= T.spendRed && lUp <= 0.05) ? 'red' : (sUp >= T.spendYellow && lUp < sUp * 0.5) ? 'yellow' : null;
      if (ss) alerts.push({ type: 'spend_up', severity: ss, durationDays: 7, confidence: rec.n >= 6 ? 'בינונית' : 'נמוכה', period: CMP,
        title: 'ההוצאה עלתה בלי תוספת לידים מתאימה',
        what: 'ההוצאה היומית עלתה ב-' + pct(sUp) + '%, ואילו הלידים ליום השתנו ב-' + sgn(lUp) + '.',
        numbers: [['הוצאה יומית', money(base.dailySpend), money(rec.dailySpend), sgn(sUp)], ['לידים ליום', base.dailyLeads.toFixed(1), rec.dailyLeads.toFixed(1)]],
        why: 'התקציב הנוסף לא מייצר תוצאה בהתאם, וזה כסף של הלקוח.', immediate: ss === 'red' });
    }
    if (base.ctr && rec.impr && base.clicks >= T.ctrMinClicks) {
      var expC = rec.impr * base.ctr, zc = (rec.clicks - expC) / Math.sqrt(expC), cd = 1 - rec.ctr / base.ctr;

        ${opp.length || drafts.length ? `<section class="card pad"><div class="h2">הזדמנויות והמלצות</div><ul class="ul">${opp.map(o => `<li>${esc(o)}</li>`).join('')}</ul>${drafts.map(d => `<div class="hyp" style="margin-top:10px"><div class="eyebrow">טיוטת עדכון ללקוח (${esc(d.channel)} · לא נשלח)</div><div style="margin:6px 0">${esc(d.text)}</div><div class="row2"><button class="btn sec sm" data-act="copy" data-arg="${esc(d.text)}">העתק</button><button class="btn sec sm" disabled title="WhatsApp לא מחובר">שליחה: דורש חיבור WhatsApp ואישור</button></div></div>`).join('')}</section>` : ''}

          ${notes.map(n => `<div class="fi"><span>${av(n.user)}</span><div style="flex:1"><div>${esc(n.text)}</div><div class="muted small">${N(fmtDay(n.day))} · ${N(hhmm(n.t))}</div></div></div>`).join('')}</section>
        <section class="card pad"><div class="h2">Demo Lab ללקוח<div class="sp"></div><span class="mock">משנה נתוני דמו</span></div><div class="chips">${O.SCENARIOS.filter(s => !s.special).map(s => `<button class="chip" data-act="scen1" data-arg="${s.id}|${id}">${esc(s.name)}</button>`).join('')}</div>
          ${(S.ops[id] || []).length ? `<button class="btn sec sm" style="margin-top:10px" data-act="resetc" data-arg="${id}">החזר את הלקוח לנתוני המקור</button>` : ''}</section>
      </div>
    </div>`;
  }
  function timeline(id) {
    const out = [];
    S.events.filter(e => e.clientId === id).forEach(e => out.push({ day: e.day, t: e.t, a: e.text, who: e.user ? byU[e.user] && byU[e.user].name : null, k: e.type === 'alert' ? 'alert' : e.type === 'verified' ? 'verified' : e.type === 'automation' ? 'automation' : 'task' }));
    S.tasks.filter(t => t.clientId === id).forEach(t => t.history.forEach(h => { if (!/נוצרה משימה/.test(h.a)) out.push({ day: h.day, t: h.t, a: h.a + ' · ' + t.title.split(' · ')[0], who: h.who, k: /אומת/.test(h.a) ? 'verified' : 'task' }); }));
    (S.notes[id] || []).forEach(n => out.push({ day: n.day, t: n.t, a: 'הערה: ' + n.text, who: byU[n.user].name, k: '' }));
    return out.sort((a, b) => b.t - a.t);
  }
  function alertCard(r, a) {
    const inv = C.investigate(r, a), t = O.openTaskFor(S, a.key), sup = { 'נתמך בנתונים': 'p-green', 'נתמך חלקית': 'p-yellow' };
    return `<section class="card al ${a.severity}" id="al-${a.key.replace(':', '-')}">

      <div class="inv">
        <div class="blk"><div class="k"><span class="tag3 t-fact">עובדה</span>מה קרה</div><div>${esc(a.what)}</div>

        <div class="blk"><div class="k">למה זה חשוב</div><div>${esc(a.why)}</div></div>
        <div class="blk"><div class="k"><span class="tag3 t-hyp">השערה</span>מה עשוי לגרום לכך (לפי הראיות)</div>${inv.hypotheses.map(h => `<div class="hyp"><div class="row2" style="align-items:flex-start;gap:8px"><span style="flex:1;font-weight:600">${esc(h.text)}</span><span class="pill ${sup[h.support] || 'p-gray'}">${esc(h.support)}</span></div><div class="small tx2" style="margin-top:4px">ראיה: ${esc(h.evidence)}</div>${h.share ? `<div class="bar"><i style="width:${Math.round(h.share * 100)}%"></i></div>` : ''}</div>`).join('')}

        <div class="blk"><div class="k">איך נדע שזה עבד</div><div class="okbox">${esc(inv.success.text)} · בדיקה חוזרת אוטומטית ${N(inv.success.days)} ימים אחרי הביצוע</div></div>
      </div>

        ${t ? `<button class="btn sec" data-go="task-${t.id}">פתח משימה (${esc(ST[t.status])})</button>` : `<button class="btn pri" data-act="mktask" data-arg="${a.key}">צור משימה</button>`}</div>

  // ----- Tasks -----
  function vTasks() {
    const tabs = [['open', 'פתוחות', t => !/closed/.test(t.status)], ['approval', 'ממתינות לאישור', t => t.status === 'awaiting_approval'], ['verify', 'לבדיקת תוצאות', t => t.status === 'awaiting_verification'], ['closed', 'נסגרו', t => t.status === 'closed'], ['all', 'הכל', () => true]];
    const cur = tabs.find(x => x[0] === U.taskTab) || tabs[0], list = S.tasks.filter(cur[2]);
    return `<div class="row2" style="margin-bottom:14px;flex-wrap:wrap;gap:10px"><div class="chips">${tabs.map(x => `<button class="chip ${U.taskTab === x[0] ? 'on' : ''}" data-act="ttab" data-arg="${x[0]}">${x[1]} · ${S.tasks.filter(x[2]).length}</button>`).join('')}</div><div class="sp"></div>
      <span class="small tx2">פועל כ: <b>${esc(me().name)}</b> (${esc(me().role)}${me().approver ? ', מורשה אישור' : ''})</span></div>
      <div class="note" style="margin-bottom:12px">זרימה: חדש ← בטיפול ← ממתין לאישור (רק לפעולות שמשנות קמפיין או תקציב או שולחות הודעה) ← בוצע ← ממתין לבדיקת תוצאות ← נסגר. משימה נסגרת רק אחרי שהמדדים מאשרים שהבעיה נפתרה.</div>

  }
  function taskCard(t) {
    const r = run.byId[t.clientId], flow = ['new', 'in_progress'].concat(t.requiresApproval ? ['awaiting_approval'] : []).concat(['done', 'awaiting_verification', 'closed']), ci = flow.indexOf(t.status);
    const late = t.due < O.today(S) && /new|in_progress|awaiting_approval/.test(t.status), btn = (a, l, cls, dis) => `<button class="btn ${cls || 'sec'} sm" data-act="task" data-arg="${t.id}|${a}" ${dis ? 'disabled title="' + esc(dis) + '"' : ''}>${l}</button>`;
    let acts = '';
    if (t.status === 'new') acts = btn('start', 'התחל טיפול', 'pri');

    if (t.status === 'awaiting_approval') acts = me().approver ? btn('approve', 'אשר ובצע', 'pri') + btn('reject', 'החזר לטיפול') : btn('approve', 'ממתין לאישור מנהל', 'sec', 'רק ניב או יובל יכולים לאשר');
    if (t.status === 'done') acts = btn('request_verify', 'קבע בדיקה חוזרת', 'pri');
    if (t.status === 'awaiting_verification') acts = `<span class="small tx2">בדיקה חוזרת אוטומטית ב-${N(fmtDay(t.recheckDay))}</span>` + (t.fixSim ? '' : btn('fix', 'סימולציה: החל השפעת תיקון')) + `<button class="btn sec sm" data-act="advance" data-arg="${Math.max(1, t.recheckDay - O.today(S))}">קדם שעון לבדיקה</button>`;
    if (t.status === 'closed') acts = btn('reopen', 'פתח מחדש');
    const v = t.verification;
    return `<section class="card tk ${U.hl === t.id ? 'hl' : ''}" id="tk-${t.id}">
      <div class="tkh"><span class="pill p-${t.severity}">${SL[t.severity]}</span><span class="t" style="flex:1;min-width:0">${esc(t.title.split(' · ')[0])}</span>${late ? '<span class="pill p-red">באיחור</span>' : ''}${t.requiresApproval ? `<span class="pill ${t.approvedBy ? 'p-green' : 'p-imp'}">${t.approvedBy ? 'אושר ע״י ' + esc(byU[t.approvedBy].name) : 'דורש אישור'}</span>` : ''}</div>
      <div class="small"><a href="#client-${t.clientId}">${esc(r ? r.name : t.clientId)}</a> · נוצרה ${t.createdBy === 'auto' ? 'אוטומטית' : 'ע״י ' + esc(byU[t.createdBy] ? byU[t.createdBy].name : '')} ב-${N(fmtDay(t.createdDay))} · יעד ${N(fmtDay(t.due))}</div>

  // ----- Ask -----

  function vAsk() {

  function doAsk(q) { if (!q.trim()) return; U.chat.push({ q }); U.chat.push({ a: O.ask(q, run, S) }); render(); }

  // ----- Automations -----
  const RTAG = { red_task: 'לקוח אדום', persist_escalate: 'הסלמה', improve_draft: 'שיפור', daily_summary: 'סיכום בוקר', overdue: 'איחור' };

      <section class="card pad"><div class="h2">יומן אוטומציות</div><div class="feed">${S.events.filter(e => e.type === 'automation').slice(0, 25).map(feedItem).join('') || '<div class="empty">עדיין לא הופעלו אוטומציות</div>'}</div></section></div>`;
  }

  // ----- Impact -----
  function vImpact() {
    const im = O.impact(run, S), A = S.assumptions, k = (l, n, s) => `<div class="kpi"><div class="l">${l}</div><div class="n">${n}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;

      ${k('זמן ממוצע מזיהוי לטיפול', im.avgMinToHandle == null ? '—' : im.avgMinToHandle < 1 ? 'פחות מדקה' : N(im.avgMinToHandle < 120 ? Math.round(im.avgMinToHandle) + ' דק׳' : (im.avgMinToHandle / 60).toFixed(1) + ' שע׳'), 'זמן אמת, מהזיהוי ועד תחילת הטיפול')}
      ${k('זוהו לפני החמרה', N(im.early), 'התחילו כצהוב ולא הגיעו לאדום')}${k('הוצאה עודפת שנמנעה (הערכה)', im.verified ? N(money(im.avoidedWeekly)) : '—', im.verified ? 'לשבוע, רק מאירועים שאומתו' : 'אין עדיין אירועים מאומתים')}
      ${k('זמן עבודה שנחסך (הערכה)', N(im.time.savedHours.toFixed(0) + ' שע׳'), 'לחודש, לפי ההנחות למטה')}${k('זמן בדיקה ידנית חלופי', N((im.time.manualMin / 60).toFixed(0) + ' שע׳'), 'לחודש')}</div>

  function palItems() {
    const q = U.palQ.trim(), acts = [['הרץ בדיקת מערכת', () => check(true)], ['יום בחיי מנהל סוכנות', startTour], ['קדם את שעון הדמו ביום', () => advance(1)], ['החלף ערכת נושא', toggleTheme]].concat(NAV.map(n => ['עבור אל: ' + n[1], () => go(n[0])]));
    const cl = run ? run.results.filter(r => !q || (r.name + r.industry).indexOf(q) >= 0).slice(0, q ? 12 : 6).map(r => ({ g: 'לקוחות', l: r.name, s: SL[r.status], dot: r.status, f: () => go('client-' + r.id) })) : [];
    return cl.concat(acts.filter(a => !q || a[0].indexOf(q) >= 0).map(a => ({ g: 'פעולות ומסכים', l: a[0], f: a[1] })));

  function renderPal() {

  }
  function openPal() { U.pal = true; U.palQ = ''; U.palI = 0; const i = document.getElementById('palIn'); i.value = ''; renderPal(); setTimeout(() => i.focus(), 20); }
  function toast(msg, kind) {
    const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="dot ${kind === 'err' ? 'd-red' : kind === 'ok' ? 'd-green' : 'd-imp'}" style="margin-top:6px"></span><span>${esc(msg)}</span>`;
    document.getElementById('toasts').appendChild(el); setTimeout(() => { el.style.opacity = 0; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 4200);
  }

  // ---------------- tour: a day in the life ----------------
  function startTour() { U.tour = { step: 0 }; U.pal = false; renderPal(); renderTour(); }
  const TS = [
    { t: 'יום בחיי מנהל סוכנות', b: () => 'נבחר לקוח תקין עם נפח פעילות גבוה, ונגרום לחריגה אמיתית בנתוני הדמו שלו. אחר כך נעבור את כל המסלול: זיהוי, חקירה, משימה, אישור, בדיקה חוזרת ודוח.', btn: '1 · צור חריגה והרץ בדיקה',
      run: () => { const p = O.pickDemoClient(run, S); U.tour.cid = p.id; O.applyScenario(S, p.id, 'cpl'); checkSync(); go('client-' + p.id); } },
    { t: 'זיהוי', b: () => { const r = run.byId[U.tour.cid], a = r.alerts[0]; return a ? `${r.name} הפך ל${SL[r.status]}. ${a.title}: ${a.what} רמת ביטחון ${a.confidence}.` : 'המנוע לא זיהה חריגה מובהקת בלקוח הזה.'; }, btn: '2 · פתח חקירה',
      run: () => { const r = run.byId[U.tour.cid], a = r.alerts[0]; if (a) { const el = document.getElementById('al-' + a.key.replace(':', '-')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } } },
    { t: 'חקירה', b: () => { const r = run.byId[U.tour.cid], a = r.alerts[0], i = a && C.investigate(r, a); return i ? `ההשערה המובילה: ${i.hypotheses[0].text} (${i.hypotheses[0].support}). ראיה: ${i.hypotheses[0].evidence} לא נקבעה סיבה שלא נבדקה: ${i.unknown[0]}.` : ''; }, btn: '3 · צור משימה מההמלצה',
      run: () => { const r = run.byId[U.tour.cid], a = r.alerts[0]; let t = O.openTaskFor(S, a.key); U.tour.auto = !!t; if (!t) t = O.createTask(S, run, a.key, { by: S.user }); U.tour.tid = t.id; save(); go('task-' + t.id); } },
    { t: 'משימה', b: () => { const t = S.tasks.find(x => x.id === U.tour.tid); return `${U.tour.auto ? 'המשימה כבר נוצרה אוטומטית (כלל: לקוח הופך לאדום)' : 'נוצרה משימה'} ל${byU[t.assignee].name}, עם יעד ${fmtDay(t.due)}. ${t.requiresApproval ? 'התוכנית כוללת ' + t.plan.filter(p => p.actionType !== 'check').map(p => O.ACTION[p.actionType]).join(' ו') + ', ולכן נדרש אישור של משתמש מורשה.' : ''}`; }, btn: () => '4 · ' + byU[S.tasks.find(x => x.id === U.tour.tid).assignee].name + ' מתחיל/ה ומגיש/ה לאישור',
      run: () => { const t = S.tasks.find(x => x.id === U.tour.tid); if (t.status === 'new') O.taskAction(S, t, 'start', t.assignee); if (t.status === 'in_progress') O.taskAction(S, t, 'submit', t.assignee); save(); go('task-' + t.id); } },
    { t: 'אישור', b: () => { const t = S.tasks.find(x => x.id === U.tour.tid); return `סטטוס: ${ST[t.status]}. עובד לא יכול לאשר. רק ניב או יובל. בדמו האישור לא משנה חשבון אמיתי, כי Meta לא מחובר.`; }, btn: '5 · אשר בתור ניב',
      run: () => { const t = S.tasks.find(x => x.id === U.tour.tid); if (t.status === 'awaiting_approval') O.taskAction(S, t, 'approve', 'niv'); save(); go('task-' + t.id); } },
    { t: 'בוצע, אבל עוד לא נסגר', b: () => { const t = S.tasks.find(x => x.id === U.tour.tid); return `"בוצע" לא סוגר את הבעיה. האוטומציה קבעה בדיקה חוזרת ל-${fmtDay(t.recheckDay)} לפי המדד: ${t.success.text}. עכשיו נחיל את השפעת התיקון על נתוני הדמו ונקדם את השעון לבדיקה.`; }, btn: '6 · החל תיקון וקדם לבדיקה החוזרת',
      run: () => { const t = S.tasks.find(x => x.id === U.tour.tid); if (!t.fixSim) { O.simulateFix(S, t); t.fixSim = true; } O.advanceDays(S, Math.max(1, (t.recheckDay || O.today(S) + 3) - O.today(S))); checkSync(); go('task-' + t.id); } },
    { t: 'בדיקה חוזרת', b: () => { const t = S.tasks.find(x => x.id === U.tour.tid), v = t.verification; return v ? (v.ok ? `אומת בנתונים: ${t.success.text}. עלות לליד ${money(v.before.cpl || 0)} ← ${money(v.after.cpl || 0)}. המשימה נסגרה, והאירוע נרשם ב-Impact Center.` : 'הבדיקה החוזרת לא אישרה שיפור, ולכן המשימה חזרה לטיפול. זו בדיוק ההתנהגות הנכונה.') : 'הבדיקה החוזרת עוד לא הגיעה.'; }, btn: '7 · הפק דוח תוצאות ללקוח',
      run: () => { U.report = { cid: U.tour.cid, days: 30 }; go('client-' + U.tour.cid); } },
    { t: 'סיום', b: () => 'זהו המסלול המלא. כל שלב רץ על מצב המערכת: הנתונים, הרמזור, המשימה, ההיסטוריה, ה-Impact Center והדוח. אפשר לחזור על ההדגמה עם לקוח אחר, או לאפס את הדמו.', btn: 'סיום', run: () => { U.tour = null; go('impact'); } }
  ];
  function renderTour() {
    const box = document.getElementById('tourBox'); if (!U.tour) { box.innerHTML = ''; return; }
    const s = TS[U.tour.step]; let body = ''; try { body = s.b(); } catch (e) { body = ''; }
    box.innerHTML = `<div class="card tour"><div class="row2"><span class="eyebrow" style="flex:1">יום בחיי מנהל סוכנות · שלב ${U.tour.step + 1}/${TS.length}</span><button class="iconbtn" style="width:28px;height:28px" data-act="tourx" aria-label="סגור">${ic('x', 14)}</button></div>
      <div class="steps">${TS.map((x, i) => `<i class="${i <= U.tour.step ? 'on' : ''}"></i>`).join('')}</div><b>${esc(s.t)}</b><p class="tx2" style="margin:6px 0 12px;font-size:13.5px">${esc(body)}</p>
      <button class="btn acc" style="width:100%" data-act="tourgo">${esc(typeof s.btn === 'function' ? s.btn() : s.btn)}</button></div>`;
  }

  // ---------------- actions ----------------
  function advance(n) { O.advanceDays(S, n); checkSync(); toast(`שעון הדמו: ${fmtDay(O.today(S))} · ${run.newAlerts.length} חריגות חדשות · ${run.cleared.length} נפתרו`, 'ok'); render(); }
  function toggleTheme() { S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); render(); }
  function scenario(sid, cid) {
    const before = run.byId[cid] ? run.byId[cid].status : null;
    if (sid === 'ignored') {
      let t = S.tasks.find(x => /new|in_progress/.test(x.status) && x.severity === 'red' && !byU[x.assignee].approver);
      if (!t) { const d = run.decisions[0] || { alert: run.results.find(r => r.status === 'red').alerts[0] }; t = O.createTask(S, run, d.alert.key, { by: S.user }); }
      if (byU[t.assignee].approver) t.assignee = 'dana';
      t.due = O.today(S); O.ev(S, 'lab', 'Demo Lab · תרחיש "עובד לא מטפל": יעד המשימה נקבע להיום', { clientId: t.clientId, ref: t.id });
      O.advanceDays(S, 1); checkSync(); U.taskTab = 'open'; toast(`${byU[t.assignee].name} לא טיפל/ה במשימה. היא עברה את היעד ונשלחה התראה פנימית`, 'ok'); go('task-' + t.id); return;
    }
    O.applyScenario(S, cid, sid); checkSync();
    const r = run.byId[cid]; toast(`${r.name}: ${before ? SL[before] : ''} ← ${SL[r.status]}${r.alerts[0] ? ' · ' + r.alerts[0].title : ''}${r.improved ? ' · זוהה שיפור' : ''}`, 'ok'); go('client-' + cid);
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-go],[data-act]'); if (!el || el.disabled) return;
    if (el.dataset.go) { U.notif = false; go(el.dataset.go); return; }
    const a = el.dataset.act, arg = el.dataset.arg;
    if (el.tagName === 'A' && a === 'close') { U.more = false; renderModal(); return; }
    e.preventDefault();
    switch (a) {
      case 'check': check(true); break;
      case 'advance': advance(+arg); U.more = false; break;
      case 'theme': toggleTheme(); break;
      case 'reset': if (U.confirmReset) { try { localStorage.removeItem(KEY); } catch (x) {} S = O.newState(T0); S.theme = 'dark'; U.tour = null; U.chat = []; U.confirmReset = false; run = null; render(); check(false); toast('הדמו אופס לנתוני המקור', 'ok'); } else { U.confirmReset = true; toast('לחץ שוב על "איפוס" תוך 4 שניות כדי לאשר מחיקה של כל השינויים'); setTimeout(() => { U.confirmReset = false; }, 4000); } break;
      case 'palette': openPal(); break;
      case 'palgo': { const it = palItems()[+arg]; U.pal = false; renderPal(); if (it) it.f(); break; }
      case 'notif': U.notif = !U.notif; renderNotif(); break;
      case 'readall': S.notifications.forEach(n => { n.read = true; }); save(); chrome(); renderNotif(); break;
      case 'nopen': { const n = S.notifications.find(x => x.id === arg); if (n) { n.read = true; save(); U.notif = false; if (n.route) go(n.route); else render(); } break; }
      case 'filter': U.filter = arg; render(); break;
      case 'period': U.period = +arg; render(); break;
      case 'metric': U.metric = arg; render(); break;
      case 'exp': U.exp = !U.exp; render(); break;
      case 'ttab': U.taskTab = arg; U.hl = null; render(); break;
      case 'mktask': { const t = O.createTask(S, run, arg, { by: S.user }); save(); toast('נוצרה משימה ל' + byU[t.assignee].name, 'ok'); go('task-' + t.id); break; }
      case 'task': { const [id, act] = arg.split('|'), t = S.tasks.find(x => x.id === id);
        if (act === 'fix') { O.simulateFix(S, t); t.fixSim = true; save(); toast('סימולציה: התיקון יחול על נתוני הדמו מהיום הבא', 'ok'); render(); break; }
        const res = O.taskAction(S, t, act, S.user); save(); toast(res.msg, res.ok ? 'ok' : 'err'); U.hl = id; render(); break; }
      case 'ask': doAsk(arg); break;
      case 'askc': U.chat.push({ q: 'למה ' + run.byId[arg].name }); U.chat.push({ a: O.ask('למה ' + run.byId[arg].name, run, S) }); go('ask'); break;
      case 'rule': S.rules[arg] = !S.rules[arg]; save(); toast((S.rules[arg] ? 'הופעל: ' : 'כובה: ') + O.RULES.find(r => r.id === arg).name); render(); break;
      case 'scen': scenario(arg, document.getElementById('labClient').value); break;
      case 'scen1': { const [sid, cid] = arg.split('|'); scenario(sid, cid); break; }
      case 'resetc': delete S.ops[arg]; checkSync(); toast('הלקוח הוחזר לנתוני המקור', 'ok'); render(); break;
      case 'note': { const i = document.getElementById('noteIn'); if (!i.value.trim()) { toast('ההערה ריקה', 'err'); break; } (S.notes[arg] = S.notes[arg] || []).unshift({ text: i.value.trim(), user: S.user, day: O.today(S), t: Date.now() }); save(); toast('ההערה נשמרה', 'ok'); render(); break; }
      case 'report': U.report = { cid: arg, days: 30 }; renderModal(); break;
      case 'rdays': U.report.days = +arg; renderModal(); break;
      case 'print': try { window.print(); } catch (x) { toast('ההדפסה נחסמה בדפדפן הזה', 'err'); } break;
      case 'copyrep': copy(reportText()); break;
      case 'copy': copy(arg); break;
      case 'close': U.report = null; U.more = false; renderModal(); break;
      case 'more': U.more = true; renderModal(); break;
      case 'tour': startTour(); break;
      case 'tourx': U.tour = null; renderTour(); break;
      case 'tourgo': { const s = TS[U.tour.step]; try { s.run(); if (U.tour) { U.tour.step = Math.min(U.tour.step + 1, TS.length - 1); } } catch (x) { console.error(x); toast('השלב נכשל: ' + x.message, 'err'); } save(); render(); break; }
    }
  });
  function copy(t) { try { navigator.clipboard.writeText(t).then(() => toast('הועתק', 'ok'), () => toast('ההעתקה נחסמה בדפדפן', 'err')); } catch (x) { toast('ההעתקה נחסמה בדפדפן', 'err'); } }
  document.addEventListener('change', e => {
    const el = e.target; if (!el.dataset || !el.dataset.chg) return;
    if (el.dataset.chg === 'assign') { const t = S.tasks.find(x => x.id === el.dataset.arg), r = O.taskAction(S, t, 'reassign', S.user, el.value); save(); toast(r.msg, r.ok ? 'ok' : 'err'); render(); }
    if (el.dataset.chg === 'assume') { S.assumptions[el.dataset.arg] = Math.max(0, +el.value || 0); save(); render(); }
    if (el.dataset.chg === 'user') { S.user = el.value; save(); render(); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'cq') { U.q = e.target.value.trim(); document.getElementById('clist').innerHTML = rows(filtered()); } });
  document.addEventListener('submit', e => { if (e.target.id === 'askF') { e.preventDefault(); const i = document.getElementById('askIn'); const q = i.value; i.value = ''; doAsk(q); setTimeout(() => { const j = document.getElementById('askIn'); if (j) j.focus(); }, 0); } });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); U.pal ? (U.pal = false, renderPal()) : openPal(); return; }
    if (e.key === 'Escape') { U.pal = false; U.report = null; U.more = false; U.notif = false; renderPal(); renderModal(); renderNotif(); return; }
    if (U.pal) { const n = palItems().length; if (e.key === 'ArrowDown') { U.palI = (U.palI + 1) % n; renderPal(); e.preventDefault(); } if (e.key === 'ArrowUp') { U.palI = (U.palI - 1 + n) % n; renderPal(); e.preventDefault(); } if (e.key === 'Enter') { const it = palItems()[U.palI]; U.pal = false; renderPal(); if (it) it.f(); } }
  });
  ['palOv', 'modalOv'].forEach(id => document.addEventListener('click', e => { if (e.target.id === id) { U.pal = false; U.report = null; U.more = false; renderPal(); renderModal(); } }));

  // ---------------- boot ----------------
  shell(); { const r = route(); if (r.v === 'clients' && r.f) U.filter = r.f; } render(); check(false);
  window.__cp = { get run() { return run; }, get S() { return S; } }; // for automated UI tests
})();
</script>
</body>
</html>
